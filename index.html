<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RCPR 租房评估器</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><p>RCPR EVALUATOR</p><h1>租房决策，<br>有据可依。</h1><span>租房性价比量化评估 · 5.0 分制 · 未知项不扣分，致命风险一票否决。</span></header><section class="context"><label>城市等级<select id="tier"><option value="0">超一线城市</option><option value="1">一线城市</option><option value="2">新一线 / 二线城市</option><option value="3">三线城市</option><option value="4">四线及以下城市</option></select></label><label>税后月收入（元）<input id="income" type="number" min="1" placeholder="例如：10000"></label><label>月租金（元）<input id="activeRent" type="number" min="0" placeholder="例如：3000"></label><label>每月用电（度）<input id="kwh" type="number" min="0" placeholder="例如：180"></label><label>电价（元/度）<input id="electricPrice" type="number" min="0" step="0.01" placeholder="例如：0.65"></label><label>每月用水（吨）<input id="waterM3" type="number" min="0" placeholder="例如：5"></label><label>水价（元/吨）<input id="waterPrice" type="number" min="0" step="0.1" placeholder="例如：5"></label><label>热水 / 燃气（元）<input id="hotWaterCost" type="number" min="0" placeholder="例如：80"></label><label>网络及固定杂费（元）<input id="internetCost" type="number" min="0" placeholder="例如：100"></label><label>月通勤交通（元）<input id="transitCost" type="number" min="0" placeholder="例如：180"></label><small>系统自动计算房租收入比与综合月成本。超一线建议线为 30%，超过 40% 一律熔断。</small></section><nav id="tabs"></nav><section id="risk" hidden></section><section id="summary"></section><section class="cols"><article><h2>空间硬件 <b>40%</b></h2><div id="hardware"></div></article><article><h2>地理通勤 <b>30%</b></h2><div id="commute"></div></article><article><h2>财务成本 <b>30%</b></h2><div id="finance"></div></article></section><footer>填写“暂不明确”的项目会在所属维度中自动剔除；其余已知项目会自动分摊权重。签约前请实地复核。</footer></main><script src="app.js"></script></body></html>
